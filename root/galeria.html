<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Matias Iparraguirre Rodriguez">
    <link rel="stylesheet" href="/css/style.css">
    <title>Galería de Imágenes</title>
</head>

<body>
    <main>
        <section class="galeria">
            <h1>Galería de Imágenes</h1>
            <div class="imagenes">
                <figure class="card">
                    <img src="/img/jorogumo-spider-woman-folklore.webp" alt="jorogumo spider woman folklore">
                    <figcaption>Jorogumo, la mujer araña del folclore japonés</figcaption>
                </figure>
                <figure class="card">
                    <img loading="lazy" src="/img/Takagi_Toranosuke_capturing_a_kappa_underwater_in_the_Tamura_river.webp"
                        alt="kappa japonese folklore">
                    <figcaption>Kappa, el espíritu acuático del folclore japonés</figcaption>
                </figure>
                <figure class="card">
                    <img loading="lazy" src="/img/rokurokubi - Shigueru mizuki.webp"
                        alt="rokurokubi Shigueru mizuki yokai folklore">
                    <figcaption>Rokurokubi, la criatura del folclore japonés</figcaption>
                </figure>
                <figure class="card">
                    <img loading="lazy" src="/img/tengu-japanese-mythology-1.webp" alt="tengu japanese mythology">
                    <figcaption>Tengu, los espíritus del folclore japonés</figcaption>
                </figure>
                <figure class="card">
                    <img loading="lazy" src="/img/Yoshitoshi_-_100_Aspects_of_the_Moon_-_91.webp" alt="tsuchinoko yokai folklore">
                    <figcaption>Tsuchinoko, la criatura del folclore japonés</figcaption>
                </figure>
                <figure class="card">
                    <img loading="lazy" src="/img/set-de-6-posters-de-japon_-coleccion-de-laminas-con-estetica-collage-para-la-tamanos-a3-y-a4_-_-artwork-nacnic-3.webp" alt="">
                    <figcaption>
                        decorativa
                    </figcaption>
                    <!-- es decorativa porque no aporta nada a la tematica, aunque forme parte de la galeria. es forzada -->
                </figure>
            </div>
        </section>
    </main>
     

    

</body>
<script src="/js/script.js"></script>
</html>
